name: Gate

# Non-blocking (fara branch protection pe acest repo) — semnaleaza regresii,
# nu blocheaza push/merge. Reflecta EXACT gate-ul real documentat in
# frontend/next.config.js si docs/PLAN_MASTER.md §10: tsc + jest + build
# (frontend) + pytest (backend). NU include lint (12 erori pre-existente
# in modulul dictare — vezi comentariul din next.config.js — un CI care
# rulează lint ar fi mereu roșu până la o curățenie separată, netratată aici).

"on":
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + jest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest api/tests/ -v
